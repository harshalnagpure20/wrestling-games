<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` lets the hall fill a notched screen edge to edge AND
         is what makes `env(safe-area-inset-*)` resolve to real pixels — without
         it iOS reports every inset as 0 and the interface hides under the
         cutout and the home bar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wrestling — Arena Build</title>
    <meta name="description" content="HCTP-inspired wrestling game. Phase 2: ring and arena." />
    <meta name="theme-color" content="#05070b" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
